<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CloudDoc SaaS — Editor de Texto Profesional</title>
  <!-- Bootstrap 5.3.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons 1.11.3 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Estilos Personalizados del Editor -->
  <link rel="stylesheet" href="css/editor.css">
</head>
<body class="bg-light d-flex flex-column vh-100 overflow-hidden">

  <!-- 1. BARRA SUPERIOR DE NAVEGACIÓN CORPORATIVA (NAVBAR) -->
  <header>
    <nav class="navbar navbar-expand navbar-dark bg-dark px-3 py-2 border-bottom shadow-sm">
      <div class="container-fluid px-0 d-flex justify-content-between align-items-center">
        
        <!-- Lado Izquierdo: Botón Offcanvas Móvil y Marca SaaS -->
        <div class="d-flex align-items-center gap-2">
          <!-- Visible únicamente en dispositivos móviles (< lg) -->
          <button class="btn btn-outline-light btn-sm d-lg-none" type="button" 
                  data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" aria-controls="offcanvasSidebar">
            <i class="bi bi-folder2-open fs-5"></i>
          </button>
          
          <div class="d-flex align-items-center gap-2 text-decoration-none text-white">
            <div class="bg-primary text-white rounded p-1 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
              <i class="bi bi-file-earmark-richtext-fill fs-5"></i>
            </div>
            <span class="fw-bold fs-5 tracking-tight d-none d-sm-inline">CloudDoc <span class="badge bg-primary-subtle text-primary border border-primary-subtle fs-xs">SaaS</span></span>
          </div>
        </div>

        <!-- Centro: Nombre del Documento y Estado de Sincronización -->
        <div class="d-flex align-items-center flex-grow-1 mx-2 mx-md-4" style="max-width: 450px;">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-dark border-secondary text-secondary d-none d-md-flex"><i class="bi bi-pencil-fill"></i></span>
            <input type="text" id="docTitulo" class="form-control form-control-sm bg-dark text-white border-secondary fw-semibold" 
                   placeholder="Documento sin título" aria-label="Título del documento">
          </div>
        </div>

        <!-- Lado Derecho: Acciones de Guardado, Limpieza y Estado -->
        <div class="d-flex align-items-center gap-2">
          <span id="syncBadge" class="badge bg-secondary-subtle text-secondary border border-secondary-subtle d-none d-md-inline-flex align-items-center gap-1">
            <i class="bi bi-cloud-check"></i> Sincronizado
          </span>
          <button id="btnNuevo" class="btn btn-outline-light btn-sm" title="Crear nuevo documento">
            <i class="bi bi-file-earmark-plus"></i> <span class="d-none d-md-inline ms-1">Nuevo</span>
          </button>
          <button id="btnGuardar" class="btn btn-primary btn-sm px-3 fw-medium d-flex align-items-center gap-1 shadow-sm">
            <i class="bi bi-cloud-arrow-up-fill"></i> <span>Guardar</span>
          </button>
        </div>

      </div>
    </nav>
  </header>

  <!-- 2. CONTENEDOR PRINCIPAL: SIDEBAR ESCRITORIO + ÁREA DE TRABAJO -->
  <div class="container-fluid flex-grow-1 p-0 overflow-hidden">
    <div class="row g-0 h-100">

      <!-- PANEL LATERAL FIJO (Solo visible en pantallas grandes >= lg) -->
      <aside class="col-lg-3 col-xl-2 bg-white border-end d-none d-lg-flex flex-column h-100 p-0 shadow-sm">
        <div class="p-3 border-bottom d-flex justify-content-between align-items-center bg-light-subtle">
          <h6 class="mb-0 fw-bold text-secondary text-uppercase fs-xs tracking-wider">
            <i class="bi bi-collection me-1"></i> Mis Documentos
          </h6>
          <span id="totalDocsBadge" class="badge bg-secondary rounded-pill">0</span>
        </div>
        <div class="p-2 border-bottom">
          <div class="input-group input-group-sm">
            <span class="input-group-text bg-white border-end-0"><i class="bi bi-search text-muted"></i></span>
            <input type="text" id="searchDesktop" class="form-control border-start-0 ps-0" placeholder="Buscar...">
          </div>
        </div>
        <!-- Lista Scrolleable de Documentos -->
        <div class="flex-grow-1 overflow-y-auto p-2" id="listaDocsDesktop">
          <div class="text-center text-muted py-5"><div class="spinner-border spinner-border-sm text-primary"></div> Cargando...</div>
        </div>
        <div class="p-2 border-top bg-light text-center">
          <small class="text-muted fs-xs">SaaS Cloud Node: H2 in-memory</small>
        </div>
      </aside>

      <!-- LIENZO Y EDITOR DE TEXTO PRINCIPAL -->
      <main class="col-12 col-lg-9 col-xl-10 d-flex flex-column h-100 bg-secondary-subtle overflow-hidden">
        
        <!-- BARRA DE HERRAMIENTAS WYSIWYG (Scroll horizontal en móviles) -->
        <div class="bg-white border-bottom px-2 py-2 shadow-xs editor-toolbar-wrapper">
          <div class="d-flex align-items-center gap-1 overflow-x-auto pb-1 pb-md-0 scroll-touch" id="editorToolbar">
            <!-- Grupo: Deshacer / Rehacer -->
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('undo')" title="Deshacer"><i class="bi bi-arrow-counterclockwise"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('redo')" title="Rehacer"><i class="bi bi-arrow-clockwise"></i></button>
            </div>
            <div class="vr mx-1 my-1 text-secondary opacity-25"></div>

            <!-- Grupo: Encabezados -->
            <select class="form-select form-select-sm toolbar-select w-auto" onchange="formatDoc('formatBlock', this.value); this.selectedIndex=0;">
              <option selected disabled>Estilo</option>
              <option value="p">Normal</option>
              <option value="h1">Título 1</option>
              <option value="h2">Título 2</option>
              <option value="h3">Título 3</option>
            </select>
            <div class="vr mx-1 my-1 text-secondary opacity-25"></div>

            <!-- Grupo: Formato de Texto Básico -->
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('bold')" title="Negrita (Ctrl+B)"><i class="bi bi-type-bold"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('italic')" title="Cursiva (Ctrl+I)"><i class="bi bi-type-italic"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('underline')" title="Subrayado (Ctrl+U)"><i class="bi bi-type-underline"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('strikeThrough')" title="Tachado"><i class="bi bi-type-strikethrough"></i></button>
            </div>
            <div class="vr mx-1 my-1 text-secondary opacity-25"></div>

            <!-- Grupo: Alineación -->
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('justifyLeft')" title="Alinear a la izquierda"><i class="bi bi-text-left"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('justifyCenter')" title="Centrar"><i class="bi bi-text-center"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('justifyRight')" title="Alinear a la derecha"><i class="bi bi-text-right"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('justifyFull')" title="Justificar"><i class="bi bi-justify"></i></button>
            </div>
            <div class="vr mx-1 my-1 text-secondary opacity-25"></div>

            <!-- Grupo: Listas e Indentación -->
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('insertUnorderedList')" title="Viñetas"><i class="bi bi-list-ul"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="formatDoc('insertOrderedList')" title="Numeración"><i class="bi bi-list-ol"></i></button>
            </div>
            <div class="vr mx-1 my-1 text-secondary opacity-25"></div>

            <!-- Grupo: Elementos Extras (Color, Limpieza, Enlace) -->
            <div class="btn-group btn-group-sm" role="group">
              <button type="button" class="btn btn-outline-secondary toolbar-btn position-relative overflow-hidden" title="Color de texto">
                <i class="bi bi-palette"></i>
                <input type="color" class="position-absolute top-0 start-0 opacity-0 w-100 h-100 cursor-pointer" onchange="formatDoc('foreColor', this.value)">
              </button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn" onclick="insertarHipervinculo()" title="Insertar enlace"><i class="bi bi-link-45deg"></i></button>
              <button type="button" class="btn btn-outline-secondary toolbar-btn text-danger" onclick="formatDoc('removeFormat')" title="Limpiar Formato"><i class="bi bi-eraser"></i></button>
            </div>
          </div>
        </div>

        <!-- CONTENEDOR DEL LIENZO DE PÁGINA (SCROLLABLE) -->
        <div class="flex-grow-1 overflow-y-auto p-2 p-sm-3 p-md-4 d-flex justify-content-center align-items-start editor-viewport">
          <!-- HOJA DE ESCRITURA VIRTUAL A4 ESTILO DOCUMENTO -->
          <div class="document-page bg-white shadow-sm rounded-1 p-4 p-md-5 w-100">
            <div id="docContenido" 
                 class="editor-editable-area" 
                 contenteditable="true" 
                 spellcheck="true"
                 placeholder="Comienza a redactar tu documento SaaS aquí..."></div>
          </div>
        </div>

        <!-- BARRA INFERIOR DE ESTADO Y MÉTRICAS (STATUS BAR) -->
        <footer class="bg-white border-top px-3 py-1 d-flex justify-content-between align-items-center text-muted fs-xs shadow-xs">
          <div class="d-flex gap-3">
            <span><i class="bi bi-file-earmark-font me-1"></i><span id="lblPalabras">0</span> palabras</span>
            <span><i class="bi bi-fonts me-1"></i><span id="lblCaracteres">0</span> caracteres</span>
          </div>
          <div class="d-flex align-items-center gap-2">
            <span class="badge bg-success-subtle text-success border border-success-subtle d-none d-sm-inline">Auto-Save OK</span>
            <span id="lblUltimaModificacion">Listo</span>
          </div>
        </footer>
      </main>

    </div>
  </div>

  <!-- 3. PANEL LATERAL OFFCANVAS PARA MÓVILES (< lg) -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="offcanvasSidebar" aria-labelledby="offcanvasSidebarLabel">
    <div class="offcanvas-header bg-dark text-white border-bottom">
      <h5 class="offcanvas-title fs-6 fw-bold d-flex align-items-center gap-2" id="offcanvasSidebarLabel">
        <i class="bi bi-folder2-open text-primary"></i> Mis Documentos SaaS
      </h5>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body p-0 d-flex flex-column">
      <div class="p-3 border-bottom bg-light">
        <div class="input-group input-group-sm">
          <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
          <input type="text" id="searchMobile" class="form-control" placeholder="Buscar documento...">
        </div>
      </div>
      <div class="flex-grow-1 overflow-y-auto p-2" id="listaDocsMobile">
        <!-- Se inyecta dinámicamente mediante JS -->
      </div>
    </div>
  </div>

  <!-- 4. CONTENEDOR DE TOASTS PARA NOTIFICACIONES ASÍNCRONAS -->
  <div class="toast-container position-fixed bottom-0 end-0 p-3" style="z-index: 1080;">
    <div id="appToast" class="toast align-items-center text-white bg-dark border-0 shadow" role="alert" aria-live="assertive" aria-atomic="true">
      <div class="d-flex">
        <div class="toast-body d-flex align-items-center gap-2" id="toastMessage">
          <i class="bi bi-check-circle-fill text-success fs-5"></i> Mensaje de notificación
        </div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
      </div>
    </div>
  </div>

  <!-- Scripts de Bootstrap y Aplicación -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
